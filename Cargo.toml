[package]
name = "sortini-rust"
version = "4.0.0"
edition = "2024"
rust-version = "1.95"
description = "Sort INI files while preserving comments, formatting, and encoding"
license = "MIT"
authors = ["Kody Brown"]
repository = "https://github.com/kodybrown/sortini-rust"

[lib]
name = "sortini"

[[bin]]
name = "sortini"
path = "src/main.rs"

[dependencies]
icu_collator = "2.2"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
proptest = { version = "1.11", default-features = false, features = ["std"] }
sha2 = "0.10"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
